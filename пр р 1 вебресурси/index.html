<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення товару</title>

</head>
<body>

    <h1>Замовлення товару</h1>

    <form>

        <label for="name">Ім'я покупця</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="surname">Прізвище</label>
        <input type="text" id="surname" name="surname" required>

        <br><br>

        <label for="email">Електронна пошта</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Номер телефону</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="quantity">Кількість товару</label>
        <input type="number" id="quantity" name="quantity"
               min="1" max="10">

        <br><br>

        <label for="address">Адреса доставки</label>
        <input type="text" id="address" name="address"
               minlength="10">

        <p>Спосіб доставки:</p>

        <input type="radio" name="delivery"
               value="pickup" required>
        Самовивіз


        <input type="radio" name="delivery"
               value="postomat">
        Поштомат

        <input type="radio" name="delivery"
               value="courier">
        Кур'єр

        <p>Додаткові параметри:</p>

        <input type="checkbox" name="gift">
        Подарункова упаковка

        <input type="checkbox" name="warranty">
        Додаткова гарантія

        <input type="checkbox" name="sms">
        SMS-повідомлення

        <input type="checkbox" name="call">
        Телефонний дзвінок перед доставкою

        <br><br>

        <label for="payment">Спосіб оплати</label>

        <select id="payment" name="payment">
            <option value="card">Оплата карткою</option>
            <option value="receive">Оплата при отриманні</option>
            <option value="bank">Банківський переказ</option>
        </select>


        <br><br>

        <label for="comment">Коментар до замовлення</label>
        <br>

        <textarea
            id="comment"
            name="comment"
            rows="8"
            cols="40"
            maxlength="200">
        </textarea>

        <br><br>

        <button type="submit">Відправити</button>
        <button type="reset">Очистити</button>

    </form>




</body>
</html>
